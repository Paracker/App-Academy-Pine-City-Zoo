<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard - Grade R Learning</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/parent-dashboard.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <span>🎓</span>
                <span>Parent Dashboard</span>
            </div>
            <div class="navbar-menu">
                <span id="parentName" style="margin-right: 16px;">Parent</span>
                <button onclick="logout()" class="btn btn-sm btn-outline" style="color: white; border-color: white;">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="padding: 40px 20px;">
        <h1>Your Child's Progress 👪</h1>
        
        <!-- Child Selector (if multiple children) -->
        <div class="card" style="margin-bottom: 30px;">
            <label for="childSelect" class="form-label">Select Child:</label>
            <select id="childSelect" class="form-control">
                <option value="">Loading...</option>
            </select>
        </div>

        <!-- Progress Overview -->
        <div class="grid grid-3" style="margin-bottom: 40px;">
            <div class="stats-card">
                <div class="stats-value" id="activitiesCompleted">0</div>
                <div class="stats-label">Activities Completed</div>
            </div>
            <div class="stats-card">
                <div class="stats-value" id="averageGrade">-</div>
                <div class="stats-label">Average Grade</div>
            </div>
            <div class="stats-card">
                <div class="stats-value" id="timeSpent">0h</div>
                <div class="stats-label">Time Spent Learning</div>
            </div>
        </div>

        <!-- Activity Progress -->
        <div class="card">
            <h2>Activity Progress</h2>
            <div id="activityProgress">
                <div class="empty-state">
                    <div class="empty-state-icon">📊</div>
                    <div class="empty-state-title">Parent Dashboard Coming Soon</div>
                    <div class="empty-state-description">
                        You'll be able to view your child's progress, grades, and activity completion here.
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Grades -->
        <div class="card" style="margin-top: 30px;">
            <h2>Recent Grades</h2>
            <div id="recentGrades">
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <div class="empty-state-description">No grades available yet</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>
    
    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth-guard.js"></script>
    <script>
        // Initialize parent dashboard
        async function initDashboard() {
            try {
                const currentUser = await protectPage('parent');
                document.getElementById('parentName').textContent = currentUser.displayName || 'Parent';
                
                // TODO: Load children and their progress
                console.log('Parent dashboard initialized for:', currentUser.email);
            } catch (error) {
                console.error('Dashboard initialization error:', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
